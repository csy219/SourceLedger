services:
  postgres:
    image: postgres:16-alpine
    container_name: agent-runtime-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: agent_runtime
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent_password
    ports:
      - "5433:5432"
    volumes:
      - agent_runtime_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U agent -d agent_runtime
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: agent-runtime-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
    ports:
      - "6380:6379"
    volumes:
      - agent_runtime_redisdata:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  agent_runtime_pgdata:
  agent_runtime_redisdata: